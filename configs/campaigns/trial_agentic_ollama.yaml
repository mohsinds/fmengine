# Agentic multi-strategy campaign — all-local Ollama by default.
# Caps still apply if you override layers to OpenAI/Claude.
# No weight fine-tuning — local models are inference-only for research decisions.
name: trial_agentic_ollama
dataset_id: xauusd_1m_bid_2021-01-03_2026-08-30
strategies:
  - ema_cross
  - rsi_mean_reversion
  - macd_cross
  - bollinger_breakout
  - supertrend_trend
space_path: configs/spaces/multi_family_dense.yaml
max_generations: 40
proposals_per_generation: 8
shortlist_size: 3
max_sweep_configs: 50
workers: 6
max_bars: 50000
run_fidelity: false
use_stub_llm: false
refine_space: true
allow_ingredient_proposals: true
seed: 1
initial_cash: 100000
cost_config: configs/costs/xauusd_cfd.yaml
llm_routing:
  hypothesize: { provider: ollama, model: qwen2.5-coder:7b }
  critique: { provider: ollama, model: qwen2.5:14b-instruct-q4_K_M }
  select: { provider: ollama, model: qwen2.5:14b-instruct-q4_K_M }
  report: { provider: ollama, model: qwen2.5-coder:7b }
  # Cloud overrides (optional):
  # critique: { provider: anthropic, model: claude-sonnet-4-5-20250929 }
  # report: { provider: openai, model: gpt-4o-mini }
budget:
  per_campaign_usd: 8.0
  per_day_usd: 8.0
  per_generation_usd: 1.0
  openai_usd: 3.0
  anthropic_usd: 5.0
