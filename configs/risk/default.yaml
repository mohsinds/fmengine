# Default risk / sizing configuration (XAUUSD single-instrument).
kelly_fraction: 0.25
max_risk_per_trade: 0.02
target_vol: 0.10
max_size: 1.0

limits:
  max_per_trade_loss: 500.0
  max_daily_loss: 2000.0
  max_drawdown_pct: 0.10
  max_position: 5.0
  max_trades_per_day: 50
  consecutive_loss_limit: 5

conformal:
  alpha: 0.1
  max_width: 0.4
  high_prob_threshold: 0.6
